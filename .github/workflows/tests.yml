name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m quantum_omega
      - name: Run full research workflow
        run: python -m quantum_omega run examples/polynomial_research.json --output "${{ runner.temp }}/quantum-omega-run"
      - name: Verify research artifacts
        run: python -m quantum_omega verify-run "${{ runner.temp }}/quantum-omega-run"
      - name: Archive research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/quantum-omega-run/
          if-no-files-found: warn
          retention-days: 14
